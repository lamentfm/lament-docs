version: 2

updates:
  - package-ecosystem: 'npm' # Standard GitHub keyword for JS/TS package.json & bun.lock
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps): '

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci): '
